# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy JAR app to Azure Web App - valocase-backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java version
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Select the executable Spring Boot JAR
        # target/ holds both the repackaged fat JAR and the plain
        # *.jar.original left behind by spring-boot-maven-plugin. Pick by
        # manifest rather than by name: only the repackaged JAR has
        # Start-Class. Staged as app.jar so the deploy step needs no wildcard.
        run: |
          set -eu
          executable=""
          for jar in target/*.jar; do
            [ -f "$jar" ] || continue
            manifest=$(unzip -p "$jar" META-INF/MANIFEST.MF 2>/dev/null || true)
            case "$manifest" in
              *Start-Class:*) executable="$jar"; break ;;
            esac
          done
          if [ -z "$executable" ]; then
            echo "::error::No executable Spring Boot JAR found under target/"
            ls -l target/ || true
            exit 1
          fi
          echo "Selected $executable"
          mkdir -p staging
          cp "$executable" staging/app.jar

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: staging/app.jar
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout
  
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app

      - name: Verify the downloaded JAR is executable
        run: |
          set -eu
          ls -l app.jar
          unzip -p app.jar META-INF/MANIFEST.MF | grep 'Start-Class:'
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D74C46D7EA4F4E6A96373D6082F78D76 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9741B6B6381149B698AD1B9B94618975 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A16F80FFD6324B659489185AB244C1CA }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'valocase-backend'
          slot-name: 'Production'
          package: 'app.jar'
          