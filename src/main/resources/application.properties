spring.application.name=valocase-backend

# --- Active profile ---
# Local development uses the "dev" profile by default so `mvnw spring-boot:run`
# behaves exactly as before. Override for deployment with the SPRING_PROFILES_ACTIVE
# environment variable (e.g. SPRING_PROFILES_ACTIVE=prod).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# --- Server ---
# Honoured by every profile. Defaults to 8080 when SERVER_PORT is unset.
server.port=${SERVER_PORT:8080}

# --- Datasource (shared) ---
# Connection details (url/username/password) live in the per-profile files.
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate (shared safe defaults) ---
# Schema is owned by Flyway. Hibernate only validates against it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flyway (shared) ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# --- Player activity analytics ---
# Backend-only session estimation from authenticated requests (no client
# heartbeat/logout exists). A gap longer than session-timeout ends the
# estimated session; write-throttle caps session-row updates under rapid polling.
valocase.analytics.session-timeout=PT5M
valocase.analytics.write-throttle=PT30S
# Precise client lifecycle: a client session with no reported activity for
# heartbeat-timeout is closed by the scanner (estimated); heartbeat-write-throttle
# skips redundant heartbeat writes; timeout-scan-interval is the scanner cadence.
# Client heartbeat interval is 30s; the online views treat a heartbeat within 90s
# of a foreground session as online.
valocase.analytics.heartbeat-timeout=PT2M
valocase.analytics.heartbeat-write-throttle=PT5S
valocase.analytics.timeout-scan-interval=PT30S

# --- Registration ---
# Whether POST /api/v1/guest requires countryCode. Keep FALSE until the Unity
# release with the country screen is the only client in the store: the build
# players have today sends displayName alone, and turning this on before they
# are drained turns every one of their registrations into a 400. While false, a
# request without a country still registers and the account's country_code stays
# NULL — nothing is guessed and nothing is derived from an IP address. An
# invalid country is refused either way.
valocase.registration.require-country-code=false

# --- Pre-account onboarding telemetry ---
# Unauthenticated by necessity: every event it records happens before an account
# exists. The limits below are the abuse controls, not tuning knobs — see
# OnboardingTelemetryController. A real onboarding run sends nine events, so 60
# per installation per minute is far above any legitimate client.
valocase.telemetry.enabled=true
valocase.telemetry.max-body-bytes=2048
valocase.telemetry.rate-limit-events=60
valocase.telemetry.rate-limit-window=PT1M
valocase.telemetry.rate-limit-max-tracked-installations=50000
valocase.telemetry.max-identifier-length=64
valocase.telemetry.max-app-version-length=20

# --- Client update wall (MANDATORY on 1.0.22+) ---
# Newest build published to the store. Sent to the Unity client on /wallet AND on
# /health — /health because it needs no guest token, which is exactly what a client
# with a broken or missing token does not have, and that client is the one most in
# need of being told to update.
#
# From client 1.0.22 this is NOT a dismissible notice. A player on an older build
# gets a full-screen wall with one button (UPDATE, opens the store page) and cannot
# reach the game until they update. Builds 1.0.15-1.0.21 still show the older
# popup, which has a LATER button; nothing can change that retroactively.
#
# READ BEFORE CHANGING THIS LINE:
#
#   1. Only ever set it to a version that is ALREADY LIVE in the store. Point it at
#      a version players cannot download and you have walled them in front of
#      nothing. There is no in-game way out.
#   2. Release order is: publish the AAB -> confirm the store is serving it -> bump
#      this line -> deploy the backend. Never the other way round.
#   3. Empty is the off switch and the safe default. It disables the wall for every
#      player immediately on the next deploy, which is the rollback if this is ever
#      set wrong.
#   4. A value that does not parse as dot-separated numbers shows nothing rather
#      than locking anyone out (UpdateAvailablePopup.IsNewer fails closed). Do not
#      rely on that -- it is a seatbelt, not a procedure.
#
# 1.0.27, live in the store, and this is the first time the wall does real work since
# the move to Azure. 1.0.26 shipped a half-finished recovery: it cleared a token the
# server had rejected but could not replace it, because registration waits for the
# nickname screen and that screen never reopens once setup is complete. A 1.0.26
# player who hits a 401 is left with no token, no account and no way out from inside
# the game. Walling them onto 1.0.27 is the only thing that reaches them.
#
# Builds before 1.0.26 pointed at the DigitalOcean deployment, which no longer
# exists; they reach no backend at all and never receive this value.
valocase.client.latest-version=1.0.27

# --- Free Lobby Event ---
# This cron only decides how often the backend CHECKS whether the next free
# event lobby is due; the cadence itself is owned by BattleLobbyService and
# depends on how many players are online (15 minutes normally, once a day while
# fewer than 6 are online). Checking every minute keeps the event within a
# minute of its nominal cadence.
valocase.lobby.event-cron=0 * * * * *

# --- Catalog import ---
# When true, reads classpath:catalog/skins.json + cases.json at startup and
# upserts the catalog (and neutralizes the V3 sample data). Keep false in
# production. Override per-run, e.g. mvnw spring-boot:run -Dspring-boot.run.arguments=--valocase.catalog.import-on-startup=true
valocase.catalog.import-on-startup=false
