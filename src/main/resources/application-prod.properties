# --- Production profile ---
# Activate with SPRING_PROFILES_ACTIVE=prod.
# All sensitive values are read from environment variables — no secrets in the repo.

# --- Datasource (Railway PostgreSQL) ---
# Railway's DATABASE_URL is libpq-style ("postgresql://user:pass@host:5432/db")
# which the JDBC driver/Hikari cannot consume directly. RailwayDatabaseUrlPostProcessor
# rewrites it to a real JDBC URL ("jdbc:postgresql://host:5432/db") before the
# datasource is built, so this placeholder is overridden at startup. Credentials
# are supplied separately via DATABASE_USERNAME / DATABASE_PASSWORD.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# --- JPA / Hibernate ---
# ddl-auto stays "validate" (inherited from application.properties); SQL logging off.
spring.jpa.show-sql=false

# --- Catalog import ---
# Kept disabled (matches the shared default). The real catalog is now seeded
# deterministically by Flyway migration V10__real_catalog_seed.sql, so the slow
# synchronous startup importer must NOT run on every boot.
valocase.catalog.import-on-startup=false

# --- First-launch diagnostics (temporary) ---
# Registration outcomes log at INFO/WARN and need no switch. Session tracking is
# per-request, so its submitted/succeeded lines are DEBUG and are turned on only
# while we are diagnosing why accounts are missing from the daily views. Remove
# this line to go back to quiet once the question is answered; discards and
# failures stay WARN either way.
logging.level.com.cenk.valocase.analytics.service.PlayerActivityService=DEBUG

# How often the counter snapshot is printed.
valocase.diagnostics.report-interval=PT5M

# --- Registration ---
# Phase 3 of the country rollout is this one variable. Set REQUIRE_COUNTRY_CODE=true
# only once the country-screen Unity release has replaced the build in the store;
# until then a missing countryCode must keep registering, or the clients already
# installed stop being able to create accounts at all.
valocase.registration.require-country-code=${REQUIRE_COUNTRY_CODE:false}

# --- CORS ---
# Comma-separated list of allowed origins, e.g.
#   CORS_ALLOWED_ORIGINS=https://app.valocase.com,https://www.valocase.com
valocase.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
